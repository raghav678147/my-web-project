<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formatting tags</title>
</head>    
<body>
    <h2>Formatting tags</h2>

    <!-- Visual Formatting -->
    <p><b>Bold Text</b></p>
    <p><i>Italic Text</i></p>
    <p><u>Underlined Text</u></p>
    <p><small>Smaller Text</small></p>

    <!-- Semantic Emphasis -->
    <p><strong>Strong (Important) Text</strong></p>
    <p><em>Emphasized Text</em></p>
    <p><mark>Highlighted/Marked Text</mark></p>

    <!-- Editorial Changes -->
    <p><del>Deleted/Strikethrough Text</del></p>
    <p><ins>Inserted Text</ins></p>

    <!-- Technical Formatting -->
    <p>H<sub>2</sub>O (Subscript Text)</p>
    <p>E = mc<sup>2</sup> (Superscript Text)</p>
    <p><code>code snippet</code> (Monospace Text)</p>
    
</body>
</html>
